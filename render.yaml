services:
  - type: web
    name: buildmart-api
    runtime: python
    plan: free
    buildCommand: pip install . && PYTHONPATH=backend python -m app.init_db
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: BUILDMART_SECURE_COOKIES
        value: "true"
      - key: BUILDMART_DEMO_PASSWORD
        sync: false

  # The browser only talks to this origin; /api is proxied to the API so session cookies stay same-origin.
  - type: web
    name: buildmart-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 20
    routes:
      - type: rewrite
        source: /api/*
        destination: https://buildmart-api-tvws.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
